name: Angular Web CI

on:
  push:
    branches:
      - main
    paths:
      - 'angular-app/**'
      - '.github/workflows/angular-web-ci.yml'
  pull_request:
    paths:
      - 'angular-app/**'
      - '.github/workflows/angular-web-ci.yml'

permissions:
  actions: read
  contents: read

defaults:
  run:
    working-directory: angular-app

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          filter: tree:0
          fetch-depth: 0

      # Cache node_modules
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: angular-app/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps

      - run: npx nx format:check --base="remotes/origin/main"
      - run: npx nx run-many -t lint test build typecheck e2e
